<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeevuCore</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">

  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      transition: 0.3s;
    }

    body.light {
      background: #f8fafc;
      color: #0f172a;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 18px;
      opacity: 0.75;
    }

    .theme-btn {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 24px;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    body.light .card {
      background: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 25px;
    }

    #clock {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    body.light input {
      background: white;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    button.action {
      margin-top: 12px;
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #334155;
      padding: 13px;
      margin-top: 10px;
      border-radius: 12px;
    }

    body.light li {
      background: #e2e8f0;
    }

    li.completed .task-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .task-text {
      flex: 1;
      cursor: pointer;
    }

    .delete-btn {
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }

    .progress-box {
      margin-top: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #475569;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.3s;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      padding: 15px;
      text-align: center;
      background: #334155;
      border-radius: 14px;
    }

    body.light .stat {
      background: #e2e8f0;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
    }

    .complete-btn {
      background: #22c55e;
      color: white;
    }

    footer {
      text-align: center;
      margin: 30px 0 10px;
      opacity: 0.65;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px;
      }

      h1 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div>
        <h1>⚡ DeevuCore</h1>
        <div class="subtitle">
          My Personal Productivity Dashboard
        </div>
      </div>

      <button class="theme-btn" onclick="toggleTheme()" id="themeButton">
        ☀️
      </button>
    </header>


    <!-- CLOCK -->

    <div class="card">
      <h2>🕒 Current Time</h2>
      <div id="clock">Loading...</div>
    </div>


    <!-- GOAL -->

    <div class="card">
      <h2>🎯 Today's Goal</h2>

      <input
        id="goalInput"
        type="text"
        placeholder="What is your main goal today?"
      >

      <button class="action" onclick="saveGoal()">
        Save Goal
      </button>

      <p id="goalDisplay"></p>
    </div>


    <!-- TODO -->

    <div class="card">
      <h2>📝 To-Do List</h2>

      <input
        id="taskInput"
        type="text"
        placeholder="Add a task..."
        onkeydown="handleTaskEnter(event)"
      >

      <button class="action" onclick="addTask()">
        Add
      </button>

      <ul id="taskList"></ul>
    </div>


    <!-- STUDY -->

    <div class="card">

      <h2>📚 Study Progress</h2>

      <div class="progress-box">

        <div id="progressText">
          Today's Progress 0%
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="progressFill">
          </div>
        </div>

      </div>

      <button
        class="action complete-btn"
        onclick="completeStudy()">
        + Complete Study
      </button>

      <button
        class="action reset-btn"
        onclick="resetToday()">
        Reset Today
      </button>

      <div class="stats">

        <div class="stat">
          <div class="stat-number" id="completedCount">
            0
          </div>
          <div>✅ Completed</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="totalCount">
            0
          </div>
          <div>📋 Total Tasks</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="streakCount">
            0
          </div>
          <div>🔥 Day Streak</div>
        </div>

      </div>

    </div>


    <footer>
      Built with ❤️ by Deevu
    </footer>

  </div>


  <script>

    /* =========================
       DATE
    ========================= */

    function getToday() {
      const date = new Date();

      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }


    /* =========================
       DAILY RESET
    ========================= */

    function checkDailyReset() {

      const today = getToday();
      const savedDate = localStorage.getItem("deevucoreDate");

      if (savedDate !== today) {

        localStorage.removeItem("deevucoreGoal");
        localStorage.removeItem("deevucoreTasks");
        localStorage.removeItem("studyCompleted");

        localStorage.setItem(
          "deevucoreDate",
          today
        );
      }
    }


    /* =========================
       CLOCK
    ========================= */

    function updateClock() {

      const now = new Date();

      const date =
        now.toLocaleDateString("en-IN");

      const time =
        now.toLocaleTimeString("en-IN");

      document.getElementById("clock").textContent =
        date + " • " + time;
    }

    setInterval(updateClock, 1000);

    updateClock();


    /* =========================
       THEME
    ========================= */

    function toggleTheme() {

      document.body.classList.toggle("light");

      const isLight =
        document.body.classList.contains("light");

      localStorage.setItem(
        "deevucoreTheme",
        isLight ? "light" : "dark"
      );

      document.getElementById(
        "themeButton"
      ).textContent =
        isLight ? "🌙" : "☀️";
    }


    function loadTheme() {

      const theme =
        localStorage.getItem("deevucoreTheme");

      if (theme === "light") {

        document.body.classList.add("light");

        document.getElementById(
          "themeButton"
        ).textContent = "🌙";

      } else {

        document.getElementById(
          "themeButton"
        ).textContent = "☀️";
      }
    }


    /* =========================
       GOAL
    ========================= */

    function saveGoal() {

      const input =
        document.getElementById("goalInput");

      const goal =
        input.value.trim();

      if (goal === "") return;

      localStorage.setItem(
        "deevucoreGoal",
        goal
      );

      displayGoal();

      input.value = "";
    }


    function displayGoal() {

      const goal =
        localStorage.getItem("deevucoreGoal");

      const display =
        document.getElementById("goalDisplay");

      if (goal) {

        display.textContent =
          "🎯 " + goal;

      } else {

        display.textContent = "";
      }
    }


    /* =========================
       TASKS
    ========================= */

    function getTasks() {

      return JSON.parse(
        localStorage.getItem("deevucoreTasks") || "[]"
      );
    }


    function saveTasks(tasks) {

      localStorage.setItem(
        "deevucoreTasks",
        JSON.stringify(tasks)
      );
    }


    function addTask() {

      const input =
        document.getElementById("taskInput");

      const text =
        input.value.trim();

      if (text === "") return;

      const tasks = getTasks();

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      saveTasks(tasks);

      input.value = "";

      renderTasks();
      updateProgress();
    }


    function handleTaskEnter(event) {

      if (event.key === "Enter") {
        addTask();
      }
    }


    function toggleTask(id) {

      const tasks = getTasks();

      const task =
        tasks.find(t => t.id === id);

      if (!task) return;

      task.completed =
        !task.completed;

      saveTasks(tasks);

      renderTasks();
      updateProgress();
    }


    function deleteTask(id) {

      let tasks = getTasks();

      tasks =
        tasks.filter(t => t.id !== id);

      saveTasks(tasks);

      renderTasks();
      updateProgress();
    }


    function renderTasks() {

      const list =
        document.getElementById("taskList");

      list.innerHTML = "";

      const tasks = getTasks();

      tasks.forEach(task => {

        const li =
          document.createElement("li");

        if (task.completed) {
          li.classList.add("completed");
        }

        const span =
          document.createElement("span");

        span.className = "task-text";

        span.textContent =
          task.text;

        span.onclick = function () {
          toggleTask(task.id);
        };


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-btn";

        deleteButton.textContent =
          "🗑️";

        deleteButton.onclick =
          function () {
            deleteTask(task.id);
          };


        li.appendChild(span);
        li.appendChild(deleteButton);

        list.appendChild(li);
      });
    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

      const tasks = getTasks();

      const total =
        tasks.length;

      const completed =
        tasks.filter(
          task => task.completed
        ).length;

      let percentage = 0;

      if (total > 0) {
        percentage =
          Math.round(
            (completed / total) * 100
          );
      }

      document.getElementById(
        "progressText"
      ).textContent =
        "Today's Progress " +
        percentage + "%";

      document.getElementById(
        "progressFill"
      ).style.width =
        percentage + "%";

      document.getElementById(
        "completedCount"
      ).textContent =
        completed;

      document.getElementById(
        "totalCount"
      ).textContent =
        total;
    }


    /* =========================
       STUDY
    ========================= */

    function completeStudy() {

      let completed =
        Number(
          localStorage.getItem(
            "studyCompleted"
          ) || 0
        );

      completed++;

      localStorage.setItem(
        "studyCompleted",
        completed
      );

      updateStudy();
    }


    function updateStudy() {

      const completed =
        Number(
          localStorage.getItem(
            "studyCompleted"
          ) || 0
        );

      document.getElementById(
        "streakCount"
      ).textContent =
        completed > 0 ? 1 : 0;
    }


    /* =========================
       RESET
    ========================= */

    function resetToday() {

      const confirmReset =
        confirm(
          "Aaj ka pura progress reset karna hai?"
        );

      if (!confirmReset) return;

      localStorage.removeItem(
        "deevucoreGoal"
      );

      localStorage.removeItem(
        "deevucoreTasks"
      );

      localStorage.removeItem(
        "studyCompleted"
      );

      displayGoal();
      renderTasks();
      updateProgress();
      updateStudy();
    }


    /* =========================
       START APP
    ========================= */

    checkDailyReset();

    loadTheme();

    displayGoal();

    renderTasks();

    updateProgress();

    updateStudy();

  </script>

</body>
</html
