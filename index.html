<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeevuCore</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="top-bar">

      <div>
        <div class="brand">⚡ DeevuCore</div>
        <p>My Personal Productivity Dashboard</p>
      </div>

      <button
        class="theme-btn"
        onclick="toggleTheme()"
        id="themeButton"
        aria-label="Toggle theme"
      >
        ☀️
      </button>

    </div>

  </header>


  <main>

    <!-- CURRENT TIME -->
    <section class="card">

      <h2>🕒 Current Time</h2>

      <div id="clock">
        Loading...
      </div>

    </section>


    <!-- DAILY GOAL -->
    <section class="card">

      <h2>🎯 Today's Goal</h2>

      <input
        id="goalInput"
        type="text"
        placeholder="What is your main goal today?"
      >

      <button onclick="saveGoal()">
        Save Goal
      </button>

      <div id="goal"></div>

    </section>


    <!-- TODO -->
    <section class="card">

      <h2>📝 To-Do List</h2>

      <div class="input-row">

        <input
          id="taskInput"
          type="text"
          placeholder="Add a task..."
          onkeydown="handleTaskEnter(event)"
        >

        <button onclick="addTask()">
          Add
        </button>

      </div>

      <ul id="taskList"></ul>

    </section>


    <!-- STUDY PROGRESS -->
    <section class="card">

      <h2>📚 Study Progress</h2>

      <div class="progress-info">

        <span>Today's Progress</span>

        <span id="progressText">
          0%
        </span>

      </div>

      <div class="progress-bar">

        <div id="progress"></div>

      </div>

      <button onclick="increaseProgress()">
        + Complete Study
      </button>

      <button
        class="secondary-btn"
        onclick="resetProgress()"
      >
        Reset
      </button>

    </section>


    <!-- STATISTICS -->
    <section class="card stats">

      <div>

        <span>✅</span>

        <strong id="completed">
          0
        </strong>

        <small>
          Completed
        </small>

      </div>


      <div>

        <span>📋</span>

        <strong id="total">
          0
        </strong>

        <small>
          Total Tasks
        </small>

      </div>


      <div>

        <span>🔥</span>

        <strong id="streak">
          1
        </strong>

        <small>
          Day Streak
        </small>

      </div>

    </section>

  </main>


  <footer>

    <p>
      Built with ❤️ by Deevu
    </p>

  </footer>


  <script>

    /* =========================================
       LOCAL DATE
       ========================================= */

    function getToday() {

      const now = new Date();

      const year = now.getFullYear();

      const month =
        String(now.getMonth() + 1).padStart(2, "0");

      const day =
        String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    /* =========================================
       DAILY RESET
       ========================================= */

    const today = getToday();

    const savedDate =
      localStorage.getItem("devuDate");


    if (savedDate !== today) {

      localStorage.removeItem("dailyGoal");

      localStorage.removeItem("tasks");

      localStorage.removeItem("progress");

      localStorage.setItem(
        "devuDate",
        today
      );

    }


    /* =========================================
       CLOCK
       ========================================= */

    function updateClock() {

      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleDateString() +
        " • " +
        now.toLocaleTimeString();

    }


    setInterval(updateClock, 1000);

    updateClock();


    /* =========================================
       THEME SYSTEM
       ========================================= */

    let theme =
      localStorage.getItem("theme") || "dark";


    function applyTheme() {

      const button =
        document.getElementById("themeButton");


      if (theme === "light") {

        document.body.classList.add("light");

        button.textContent = "🌙";

        button.title = "Switch to Dark Mode";

      } else {

        document.body.classList.remove("light");

        button.textContent = "☀️";

        button.title = "Switch to Light Mode";

      }

    }


    function toggleTheme() {

      if (theme === "dark") {

        theme = "light";

      } else {

        theme = "dark";

      }


      localStorage.setItem(
        "theme",
        theme
      );


      applyTheme();

    }


    /* =========================================
       DAILY GOAL
       ========================================= */

    function saveGoal() {

      const input =
        document.getElementById("goalInput");

      const goal =
        input.value.trim();


      if (goal === "") {

        return;

      }


      localStorage.setItem(
        "dailyGoal",
        goal
      );


      showGoal(goal);


      input.value = "";

    }


    function showGoal(goal) {

      document.getElementById("goal")
        .textContent =
        "🎯 " + goal;

    }


    /* =========================================
       TASK SYSTEM
       ========================================= */

    let tasks =
      JSON.parse(
        localStorage.getItem("tasks") || "[]"
      );


    function saveTasks() {

      localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
      );

    }


    function addTask() {

      const input =
        document.getElementById("taskInput");

      const text =
        input.value.trim();


      if (text === "") {

        return;

      }


      tasks.push({

        text: text,

        completed: false

      });


      input.value = "";


      saveTasks();

      renderTasks();

    }


    function handleTaskEnter(event) {

      if (event.key === "Enter") {

        addTask();

      }

    }


    function toggleTask(index) {

      tasks[index].completed =
        !tasks[index].completed;


      saveTasks();

      renderTasks();

    }


    function deleteTask(index) {

      tasks.splice(index, 1);


      saveTasks();

      renderTasks();

    }


    function renderTasks() {

      const list =
        document.getElementById("taskList");


      list.innerHTML = "";


      tasks.forEach((task, index) => {

        const li =
          document.createElement("li");


        const taskText =
          document.createElement("span");


        taskText.className =
          "task-text";


        taskText.textContent =
          (task.completed ? "✅ " : "⬜ ") +
          task.text;


        taskText.onclick =
          function () {

            toggleTask(index);

          };


        const deleteButton =
          document.createElement("button");


        deleteButton.className =
          "delete";


        deleteButton.textContent =
          "✕";


        deleteButton.onclick =
          function () {

            deleteTask(index);

          };


        li.appendChild(taskText);

        li.appendChild(deleteButton);


        if (task.completed) {

          li.classList.add("completed");

        }


        list.appendChild(li);

      });


      updateStats();

    }


    /* =========================================
       STATISTICS
       ========================================= */

    function updateStats() {

      const completed =
        tasks.filter(
          task => task.completed
        ).length;


      document.getElementById("completed")
        .textContent =
        completed;


      document.getElementById("total")
        .textContent =
        tasks.length;

    }


    /* =========================================
       STUDY PROGRESS
       ========================================= */

    let progress =
      Number(
        localStorage.getItem("progress") || 0
      );


    function updateProgress() {

      document.getElementById("progress")
        .style.width =
        progress + "%";


      document.getElementById("progressText")
        .textContent =
        progress + "%";


      localStorage.setItem(
        "progress",
        progress
      );

    }


    function increaseProgress() {

      progress += 10;


      if (progress > 100) {

        progress = 100;

      }


      updateProgress();

    }


    function resetProgress() {

      progress = 0;

      updateProgress();

    }


    /* =========================================
       LOAD DATA
       ========================================= */

    window.onload = function () {

      const savedGoal =
        localStorage.getItem("dailyGoal");


      if (savedGoal) {

        showGoal(savedGoal);

      }


      applyTheme();

      renderTasks();

      updateProgress();

    };

  </script>

</body>

</html>
