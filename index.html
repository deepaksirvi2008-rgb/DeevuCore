
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeevuCore</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>⚡ DeevuCore</h1>
  <p>My Personal Productivity Dashboard</p>

  <hr>

  <h2>🕒 Current Time</h2>
  <div id="clock">Loading...</div>

  <h2>🎯 Today's Goal</h2>

  <input
    id="goalInput"
    type="text"
    placeholder="Enter your goal"
  >

  <button onclick="saveGoal()">Save Goal</button>

  <p id="goal"></p>

  <h2>📝 To-Do</h2>

  <input
    id="taskInput"
    type="text"
    placeholder="Enter a task"
  >

  <button onclick="addTask()">Add Task</button>

  <ul id="taskList"></ul>


  <script>

    /* =========================
       LIVE CLOCK
    ========================= */

    function updateClock() {

      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleDateString() +
        " • " +
        now.toLocaleTimeString();

    }

    setInterval(updateClock, 1000);

    updateClock();


    /* =========================
       DAILY GOAL
    ========================= */

    function saveGoal() {

      const input =
        document.getElementById("goalInput");

      const goal =
        input.value.trim();

      if (goal === "") {
        return;
      }

      localStorage.setItem(
        "dailyGoal",
        goal
      );

      document.getElementById("goal").textContent =
        "🎯 " + goal;

      input.value = "";

    }


    /* =========================
       TO-DO LIST
    ========================= */

    function addTask() {

      const input =
        document.getElementById("taskInput");

      const task =
        input.value.trim();

      if (task === "") {
        return;
      }

      const li =
        document.createElement("li");

      li.textContent = task;


      li.onclick = function () {

        if (
          li.style.textDecoration ===
          "line-through"
        ) {

          li.style.textDecoration =
            "none";

        } else {

          li.style.textDecoration =
            "line-through";

        }

      };


      document
        .getElementById("taskList")
        .appendChild(li);

      input.value = "";

    }


    /* =========================
       LOAD SAVED GOAL
    ========================= */

    window.onload = function () {

      const savedGoal =
        localStorage.getItem("dailyGoal");

      if (savedGoal) {

        document.getElementById("goal").textContent =
          "🎯 " + savedGoal;

      }

    };

  </script>

</body>
</html>
